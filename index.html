
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mines Casino</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0; background:#10131b; color:white;
  font-family:Arial,sans-serif; min-height:100vh;
  display:flex; justify-content:center; padding:25px 12px;
}
.container { width:100%; max-width:850px; }
header { display:flex; justify-content:space-between;
align-items:center; margin-bottom:30px; }
.logo { font-size:27px; font-weight:900; color:#39d98a; }
.balance { background:#222938; padding:13px 20px;
border-radius:12px; font-weight:bold; }
.game { display:grid; grid-template-columns:240px 1fr; gap:22px; }
.panel,.board-container {
background:#1a202c; padding:20px; border-radius:17px;
}
label { display:block; color:#aab3c2; margin:15px 0 8px; }
input,select {
width:100%; padding:13px; background:#101722;
border:1px solid #354052; border-radius:9px;
color:white; font-size:16px;
}
button { cursor:pointer; border:0; font-weight:bold;
border-radius:9px; padding:14px; }
.start { background:#39d98a; color:#102019;
width:100%; margin-top:20px; font-size:16px; }
.cashout { background:#e9b949; color:#201900;
width:100%; margin-top:12px; font-size:16px; }
button:disabled { opacity:.35; cursor:not-allowed; }
.grid {
display:grid; grid-template-columns:repeat(5,1fr);
gap:9px; max-width:480px; margin:auto;
}
.tile {
aspect-ratio:1; background:#303d51;
border-bottom:4px solid #202a3a;
color:white; font-size:clamp(20px,5vw,34px);
transition:.15s;
}
.tile:hover:not(:disabled) { background:#40516a; }
.tile.safe { background:#39d98a; border-color:#20a66a; }
.tile.bomb { background:#e34b58; border-color:#a82e3b; }
.tile:disabled { opacity:1; }
.stats { display:flex; justify-content:space-between;
margin-bottom:18px; color:#aab3c2; }
.multiplier { text-align:center; font-size:29px;
font-weight:bold; color:#39d98a; margin:18px; }
.message { text-align:center; color:#aab3c2;
min-height:25px; margin-top:18px; }
h3 { margin-top:0; }
@media(max-width:650px) {
.game { grid-template-columns:1fr; }
.panel { order:2; }
.board-container { order:1; }
.grid { gap:6px; }
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">💎 MINES</div>
  <div class="balance">Saldo: <span id="balance">1000.00</span> kr</div>
</header>

<div class="game">
  <div class="panel">
    <h3>Inställningar</h3>
    <label>Insats (kr)</label>
    <input id="bet" type="number" value="10" min="1" max="1000">

    <label>Antal minor</label>
    <select id="mines">
      <option value="1">1 mina</option>
      <option value="3">3 minor</option>
      <option value="5" selected>5 minor</option>
      <option value="8">8 minor</option>
      <option value="10">10 minor</option>
      <option value="15">15 minor</option>
      <option value="20">20 minor</option>
      <option value="24">24 minor</option>
    </select>

    <button class="start" id="start" onclick="startGame()">
      STARTA SPEL
    </button>
    <button class="cashout" id="cashout" onclick="cashOut()" disabled>
      CASH OUT
    </button>
    <p style="color:#8995a7;font-size:12px;line-height:1.5">
      Demo med virtuella pengar. Inga riktiga insättningar
      eller uttag.
    </p>
  </div>

  <div class="board-container">
    <div class="stats">
      <span>Hittade diamanter: <b id="found">0</b></span>
      <span>Minor: <b id="mineCount">5</b></span>
    </div>
    <div class="multiplier" id="multiplier">1.00x</div>
    <div class="grid" id="grid"></div>
    <div class="message" id="message">
      Välj insats och tryck på Starta spel!
    </div>
  </div>
</div>
</div>

<script>
let balance = 1000;
let bet = 0;
let minePositions = [];
let revealed = [];
let mineCount = 5;
let multiplier = 1;
let playing = false;
let roundOver = false;

const $ = id => document.getElementById(id);

function update() {
  $("balance").textContent = balance.toFixed(2);
  $("found").textContent = revealed.length;
  $("mineCount").textContent = mineCount;
  $("multiplier").textContent = multiplier.toFixed(2) + "x";
  $("cashout").disabled = !playing || revealed.length === 0;
}

function randomMines(count) {
  let positions = [];
  while (positions.length < count) {
    let n = crypto.getRandomValues(new Uint32Array(1))[0] % 25;
    if (!positions.includes(n)) positions.push(n);
  }
  return positions;
}

function startGame() {
  if (playing) return;

  bet = Number($("bet").value);
  mineCount = Number($("mines").value);

  if (!Number.isFinite(bet) || bet <= 0 || bet > balance) {
    $("message").textContent = "Ogiltig insats eller för lågt saldo!";
    return;
  }

  balance -= bet;
  minePositions = randomMines(mineCount);
  revealed = [];
  multiplier = 1;
  playing = true;
  roundOver = false;

  $("start").disabled = true;
  $("bet").disabled = true;
  $("mines").disabled = true;
  $("message").textContent = "Hitta diamanterna och undvik minorna!";
  renderGrid();
  update();
}

function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";

  for (let i = 0; i < 25; i++) {
    const tile = document.createElement("button");
    tile.className = "tile";
    tile.textContent = "◆";

    if (revealed.includes(i)) {
      tile.classList.add("safe");
      tile.textContent = "💎";
      tile.disabled = true;
    }

    tile.onclick = () => clickTile(i);
    grid.appendChild(tile);
  }
}

function calculateMultiplier(safeCount) {
  let probability = 1;
  for (let i = 0; i < safeCount; i++) {
    probability *= (25 - mineCount - i) / (25 - i);
  }
  return 0.99 / probability;
}

function clickTile(index) {
  if (!playing || revealed.includes(index)) return;

  if (minePositions.includes(index)) {
    playing = false;
    roundOver = true;
    revealAll();
    $("message").textContent = "💥 BOOM! Du förlorade insatsen.";
    $("start").disabled = false;
    $("bet").disabled = false;
    $("mines").disabled = false;
    update();
    return;
  }

  revealed.push(index);
  multiplier = calculateMultiplier(revealed.length);

  renderGrid();
  update();

  $("message").textContent =
    "💎 Diamant hittad! Du kan fortsätta eller ta ut vinsten.";

  if (revealed.length === 25 - mineCount) {
    cashOut();
  }
}

function revealAll() {
  const tiles = document.querySelectorAll(".tile");
  tiles.forEach((tile, i) => {
    if (minePositions.includes(i)) {
      tile.classList.add("bomb");
      tile.textContent = "💣";
    } else if (revealed.includes(i)) {
      tile.classList.add("safe");
      tile.textContent = "💎";
    }
    tile.disabled = true;
  });
}

function cashOut() {
  if (!playing || revealed.length === 0) return;

  const winnings = bet * multiplier;
  balance += winnings;
  playing = false;

  revealAll();
  $("message").textContent =
    "🎉 Du tog ut " + winnings.toFixed(2) + " kr!";

  $("start").disabled = false;
  $("bet").disabled = false;
  $("mines").disabled = false;
  update();
}

renderGrid();
update();
</script>
</body>
</html>
